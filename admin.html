<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101f38" />
    <title>ATTENZA — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="home-shell">
        <aside class="sidebar" aria-label="Main navigation">
            <div class="sidebar-logo">A</div>
            <nav class="sidebar-nav">
                <a class="sidebar-link" href="home.html">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 11.5 12 4l9 7.5" />
                        <path d="M5.5 10v9.5h13V10" />
                        <path d="M9.5 19.5V13.5h5v6" />
                    </svg>
                    <span>HOME</span>
                </a>
                <button class="sidebar-link" type="button" data-soon="Attendance history">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3.3 2" />
                    </svg>
                    <span>HISTORY</span>
                </button>
                <button class="sidebar-link" type="button" data-soon="Profile">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8.2" r="3.4" />
                        <path d="M4.8 19.4a7.2 7.2 0 0 1 14.4 0" />
                    </svg>
                    <span>PROFILE</span>
                </button>
                <button class="sidebar-link" type="button" data-soon="Settings">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.7a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.4 2.7a7.6 7.6 0 0 0-2.6 1.5l-2.4-.7-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.7a7.6 7.6 0 0 0 2.6-1.5l2.4.7 2-3.4-2-1.6Z" />
                    </svg>
                    <span>SETTINGS</span>
                </button>
                <a class="sidebar-link active" href="admin.html" aria-current="page">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                    <span>ADMIN</span>
                </a>
            </nav>
            <div class="sidebar-foot">
                <button class="sidebar-link" id="signOut" type="button" title="Sign out">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 4H5.5a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 5.5 20H9" />
                        <path d="M16 16.5 21 12l-5-4.5" />
                        <path d="M21 12H9" />
                    </svg>
                    <span>SIGN OUT</span>
                </button>
            </div>
        </aside>

        <main class="home-main">
            <div class="home-topbar">
                <span class="date-chip" id="today"></span>
                <span class="secure"><b>●</b> SECURE SESSION</span>
            </div>

            <div class="home-top-row">
                <div class="home-greeting">
                    <p class="step-label">ADMIN</p>
                    <h1>Sign-in requests.</h1>
                    <p id="requestCountText">Checking for pending requests…</p>
                </div>
            </div>

            <section class="home-panel">
                <h3>Waiting on your approval</h3>
                <div id="requestList">
                    <div class="activity-row">
                        <div>
                            <span class="a-main">Loading…</span>
                            <span class="a-sub">Checking for requests that need your approval.</span>
                        </div>
                        <span class="a-time">—</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="admin.js"></script>
</body>

</html>
